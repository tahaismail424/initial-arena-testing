# Scenario SPEC for scripts/generate_campus_scenario.py (guide: docs/14-campus-world.md).
#
# One entry per template under `templates:`. Every parameter is SAMPLED once per (template, seed):
#   [lo, hi]            -> a float drawn uniformly            e.g. width: [2.0, 4.0]
#   {int: [lo, hi]}     -> an integer                         e.g. n_oncoming: {int: [6, 14]}
#   {choice: [a, b]}    -> one of the listed values           e.g. behavior: {choice: [1, 2]}
#   {range: [lo, hi]}   -> kept as a range (the template draws per pedestrian), e.g. speed: {range: [0.9, 1.5]}
#   a plain value       -> fixed
# Generate:  uv run scripts/generate_campus_scenario.py scenarios/campus/stress.yaml --seeds 0 9

name: stress
seed: 0
model: actor1                 # Gazebo actor for every pedestrian (only actor1 is verified working)

defaults:                     # HuNav fields for every pedestrian (see scenarios/hallway_tame.yaml for the gotchas)
  radius: 0.35
  goal_radius: 0.6
  cyclic_goals: true
  behavior:
    type: 1                   # REGULAR
    # MUST be set (default 0 = people walk through each other) and must be FLOATS (Arena drops int fields).
    # Arena hard-codes the goal force to 20 (lightsfm default 2), so these are ~10x lightsfm's defaults (2.1, 10)
    # to keep the same balance. Tested (docs/14 §8): 5/10 -> people overlapped (< 0.4 m) 23% of the time in the
    # door and corridor flows, 20/30 -> 9% corridor, 1% intersection, 4% plaza.
    social_force_factor: 20.0
    obstacle_force_factor: 30.0

templates:
  corridor_counterflow:       # two-way traffic in a corridor narrowed by panels (x 6..22)
    width: [2.0, 4.0]         # clear width of the narrowed section (m); the shell corridor is 5 m
    n_oncoming: {int: [6, 12]}  # start on their westbound leg (towards the robot)
    n_with: {int: [0, 4]}       # start on their eastbound leg (overtaking the robot)
    speed: {range: [0.9, 1.5]}

  door_exit:                  # door between riser and plaza against an exiting crowd
    door_width: [1.2, 2.2]    # m; >= 1.2 (Jackal ~0.5 m wide incl. wheels; people 0.7 m)
    door_offset: [-1.0, 1.0]  # door centre relative to the shell opening's centre (clipped: >= 0.5 m block each side)
    n_exiting: {int: [10, 20]}
    n_waiting: {int: [0, 3]}  # people standing beside the door (plaza side)
    speed: {range: [0.8, 1.4]}
    wave: true                # everyone walks out at t = 0 and leaves along the crossing corridor (one-way)

  blind_corner:               # people come round the corridor -> riser corner
    n: {int: [3, 8]}
    speed: {range: [1.0, 2.0]}
    riser_width: [3.0, 5.0]   # < 5 narrows the riser above the corner (y 5.5..16.5)

  intersection:               # two crossing streams at the riser x crossing corridor
    n_east: {int: [4, 10]}
    n_west: {int: [4, 10]}
    speed: {range: [0.9, 1.5]}
    group_frac: [0.0, 0.5]    # probability that a person starts a pair/triple instead of walking alone

  plaza_dense:                # dense milling crowd around the robot's diagonal across the plaza
    n: {int: [15, 35]}
    band: [3.0, 5.0]          # half-width (m) of the band around the start-goal line where people mill
    speed: {range: [0.5, 1.3]}
    frac_impassive: [0.0, 0.3]  # HuNav behaviour 2 instead of 1
    frac_standing: [0.0, 0.15]  # people standing still in the band

  gauntlet:                   # every zone in one ~80 m episode; smaller crowds (total ~30-55 people)
    corridor_counterflow:
      width: [2.2, 4.0]
      n_oncoming: {int: [4, 8]}
      n_with: {int: [0, 2]}
      speed: {range: [0.9, 1.5]}
    blind_corner:
      n: {int: [3, 6]}
      speed: {range: [1.0, 1.8]}
      riser_width: [3.0, 5.0]
    intersection:
      n_east: {int: [3, 6]}
      n_west: {int: [3, 6]}
      speed: {range: [0.9, 1.5]}
      group_frac: [0.0, 0.4]
    door_exit:
      door_width: [1.7, 2.4]  # two-way traffic needs two lanes (>= 1.7 m)
      door_offset: [-1.0, 1.0]
      n_exiting: {int: [6, 10]}
      n_waiting: {int: [0, 2]}
      speed: {range: [0.8, 1.4]}
      wave: false             # random phases: two-way door traffic whenever the robot arrives
    plaza_dense:
      n: {int: [12, 20]}
      band: [3.0, 5.0]
      speed: {range: [0.5, 1.3]}
      frac_impassive: [0.0, 0.3]
      frac_standing: [0.0, 0.15]
