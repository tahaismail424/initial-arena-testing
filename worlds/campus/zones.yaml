  corner: [32.5, 2.5]
  riser_mid: [32.5, 12.0]
  intersection: [32.5, 20.5]
  crossing_west: [14.0, 20.5]
  crossing_east: [51.0, 20.5]
  below_door: [32.5, 26.0]
  above_door: [32.5, 34.0]
