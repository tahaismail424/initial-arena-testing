zones:
  corridor:
    rect: [0.0, 0.0, 35.0, 5.0]
    role: counterflow corridor; its east end is the blind corner
  riser:
    rect: [30.0, 0.0, 35.0, 30.0]
    role: vertical corridor joining corridor -> intersection -> door
  crossing:
    rect: [12.0, 18.0, 53.0, 23.0]
    role: east-west corridor; crosses the riser = intersection
  plaza:
    rect: [20.0, 30.0, 48.0, 52.0]
    role: open plaza; its south wall has the door
